name: Apply mobile input zoom fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-input-fix.yml"

permissions:
  contents: write

jobs:
  patch-mobile-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive input sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          marker = "/* LAMSA MOBILE INPUT FIX */"
          if marker in html:
              print("Mobile input fix already present.")
              raise SystemExit(0)
          css = """
          <style>
          /* LAMSA MOBILE INPUT FIX */
          @media (max-width: 768px) {
            html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
            input, textarea, select, button, [contenteditable="true"] {
              font-size: 16px !important;
            }
            input, textarea, select {
              max-width: 100%;
              box-sizing: border-box;
            }
          }
          </style>
          """
          if re.search(r"</head\s*>", html, flags=re.I):
              html = re.sub(r"</head\s*>", css + "\\n</head>", html, count=1, flags=re.I)
          else:
              html = css + html
          p.write_text(html, encoding="utf-8")
          print("Inserted mobile input zoom fix.")
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile zoom on input focus"
          git push
